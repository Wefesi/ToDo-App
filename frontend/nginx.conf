# The frontend now uses frontend/server.mjs for static serving and API proxying.
# This file is retained as an optional Nginx configuration for deployments that
# choose Nginx as their static server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://todo-backend:8080;
    }
}
