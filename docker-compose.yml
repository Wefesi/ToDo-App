services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: todo-api:local
    ports:
      - "5056:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - todo-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: todo-frontend:local
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
