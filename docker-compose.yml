services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: todo-app:local
    ports:
      - "5056:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
